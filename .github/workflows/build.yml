name: Build Quran videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many clips to build (3 per day)"
        default: "21"
      start_date:
        description: "Date of the first post, YYYY-MM-DD (empty = tomorrow, Baghdad time)"
        default: ""
  schedule:
    # Every Thursday 04:00 UTC = 07:00 Baghdad. Builds Friday..Thursday of next week.
    - cron: "0 4 * * 4"

permissions:
  contents: write

concurrency:
  group: build-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libfribidi0 libharfbuzz0b
          pip install -q pillow requests arabic-reshaper python-bidi

      - name: Get background library
        run: |
          mkdir -p library
          gh release download library -D library -R "$GITHUB_REPOSITORY" || echo "No library yet - it will be built"

      - name: Decide batch
        id: batch
        run: |
          START="${{ github.event.inputs.start_date }}"
          if [ -z "$START" ]; then START=$(TZ=Asia/Baghdad date -d tomorrow +%F); fi
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=21; fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=batch-$START-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/build.py \
            --count "${{ steps.batch.outputs.count }}" \
            --start-date "${{ steps.batch.outputs.start }}" \
            --tag "${{ steps.batch.outputs.tag }}"

      - name: Save background library (first run only)
        run: |
          if [ -f library/.new ]; then
            gh release create library -R "$GITHUB_REPOSITORY" \
              --title "Background library" \
              --notes "Nature videos from Pixabay, used under the Pixabay Content License. See library.json for credits." \
              library/*.mp4 library/library.json
          fi

      - name: Publish batch
        run: |
          TAG="${{ steps.batch.outputs.tag }}"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "Videos from ${{ steps.batch.outputs.start }}" \
            --notes "Quran clips, recitation by Sheikh Mohamed Siddiq al-Minshawi (Mujawwad). Backgrounds from Pixabay." \
            out/*.mp4 out/manifest.json
          mkdir -p manifests
          cp out/manifest.json "manifests/$TAG.json"
          cp out/manifest.json manifests/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json manifests
          git commit -m "Batch $TAG"
          git push
