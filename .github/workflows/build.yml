name: Build Quran videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Khatma clips to build (posted 10:00)"
        default: "7"
      featured:
        description: "Featured clips to build (posted 20:00)"
        default: "7"
      start_date:
        description: "Date of the first post, YYYY-MM-DD (empty = tomorrow, Baghdad time)"
        default: ""
      not_before:
        description: "Skip publish slots before this time, e.g. 2026-10-08T15:30:00+03:00"
        default: ""
  schedule:
    # Every Thursday 04:00 UTC = 07:00 Baghdad: 7 khatma + 7 featured clips for the week.
    - cron: "0 4 * * 4"

permissions:
  contents: write

concurrency:
  group: build-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow requests arabic-reshaper python-bidi

      - name: Get painting library
        run: |
          mkdir -p paintings
          gh release download paintings -D paintings -R "$GITHUB_REPOSITORY" || echo "No paintings yet - they will be downloaded"

      - name: Decide batch
        id: batch
        run: |
          START="${{ github.event.inputs.start_date }}"
          if [ -z "$START" ]; then START=$(TZ=Asia/Baghdad date -d tomorrow +%F); fi
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=7; fi
          FEAT="${{ github.event.inputs.featured }}"
          if [ -z "$FEAT" ]; then FEAT=7; fi
          echo "featured=$FEAT" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=batch-$START-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build videos
        env:
          # The Pixabay key is saved in the repo under the name PEXELS_API_KEY.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PIXABAY_API_KEY" ]; then echo "ERROR: secret PIXABAY_API_KEY is empty or missing"; fi
          set -o pipefail
          python -u scripts/build.py \
            --count "${{ steps.batch.outputs.count }}" \
            --featured "${{ steps.batch.outputs.featured }}" \
            --library paintings \
            --start-date "${{ steps.batch.outputs.start }}" \
            --tag "${{ steps.batch.outputs.tag }}" \
            --not-before "${{ github.event.inputs.not_before }}" 2>&1 | tee build.log

      - name: Save painting library (when it changed)
        if: always()
        run: |
          if [ -f paintings/.new ]; then
            gh release delete paintings -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
            gh release create paintings -R "$GITHUB_REPOSITORY" --title "Painting library" \
              --notes "Public-domain landscape paintings from Wikimedia Commons. See paintings_lib.json for titles and links." \
              paintings/*.jpg paintings/paintings_lib.json
          fi

      - name: Publish batch
        run: |
          TAG="${{ steps.batch.outputs.tag }}"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "Videos from ${{ steps.batch.outputs.start }}" \
            --notes "Quran clips, word-by-word text. Khatma: Sheikh Mohamed Siddiq al-Minshawi (Murattal). Featured: Sheikh AbdulBaset AbdulSamad (Murattal). Backgrounds: public-domain paintings (Wikimedia Commons)." \
            out/*.mp4 out/manifest.json
          mkdir -p manifests
          cp out/manifest.json "manifests/$TAG.json"
          cp out/manifest.json manifests/latest.json
          python scripts/update_queue.py out/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json manifests
          git commit -m "Batch $TAG"
          git push

      - name: Save build log
        if: always()
        run: |
          mkdir -p logs
          { echo "run: ${{ github.run_id }}  job status: ${{ job.status }}  $(date -u)"; cat build.log 2>/dev/null; } > logs/last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/last-build.log
          git commit -m "Build log ${{ github.run_id }}" || exit 0
          git pull --rebase -q origin main || true
          git push || true
